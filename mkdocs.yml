site_name: AI Engineering Knowledge Base
site_description: 个人 AI 工程知识库 - 从入门到精通的系统化学习笔记
site_author: Joe
site_url: https://sai129198.github.io/my-personal-knowledge

# 仓库配置
repo_name: sai129198/my-personal-knowledge
repo_url: https://github.com/sai129198/my-personal-knowledge
edit_uri: edit/main/docs/

# 版权
copyright: Copyright &copy; 2026 Joe

# 主题配置
theme:
  name: material
  language: zh
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs           # 顶部标签导航
    - navigation.sections       # 章节展开
    - navigation.expand         # 默认展开
    - navigation.top            # 返回顶部按钮
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索高亮
    - content.code.copy         # 代码复制按钮
    - content.code.annotate     # 代码注释
    - content.tabs.link         # 标签页联动
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  logo: assets/logo.png

# 插件
plugins:
  - search:
      lang: 
        - zh
        - en


# 扩展
markdown_extensions:
  - admonition                  # 提示框
  - pymdownx.details            # 详情折叠
  - pymdownx.superfences        # 代码块
  - pymdownx.tabbed:            # 标签页
      alternate_style: true
  - pymdownx.highlight:         # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite       # 行内代码高亮
  - pymdownx.snippets           # 代码片段
  - pymdownx.keys               # 键盘按键
  - pymdownx.mark               # 文本标记
  - pymdownx.caret              # 上标
  - pymdownx.tilde              # 下标
  - pymdownx.emoji:             # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables                      # 表格
  - toc:                        # 目录
      permalink: true
      title: 目录
  - pymdownx.magiclink          # 自动链接
  - attr_list                   # 属性列表
  - md_in_html                  # HTML 中 Markdown
  - def_list                    # 定义列表
  - pymdownx.tasklist:          # 任务列表
      custom_checkbox: true
  - pymdownx.arithmatex:        # 数学公式
      generic: true

# 额外配置
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sai129198
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # 如需 Google Analytics，替换为实际 ID
  generator: false

